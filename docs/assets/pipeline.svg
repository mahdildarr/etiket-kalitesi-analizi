<svg xmlns="http://www.w3.org/2000/svg" width="960" height="296" viewBox="0 0 960 296" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8962e"/></marker></defs>
<rect width="960" height="296" rx="14" fill="#ffffff"/>
<text x="32" y="38" font-size="18" font-weight="700" fill="#1d2733">Label quality analysis for object detection</text>
<text x="32" y="60" font-size="12.5" fill="#5b6775">Inject known label errors, find them automatically, and measure what they cost the model</text>
<g transform="translate(32.0,86)">
<rect width="198.5" height="186" rx="10" fill="#eef3f8" stroke="#c9d3dd"/>
<text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">1 · DATA</text>
<text x="14" y="54" font-size="12.5" font-weight="700" fill="#1d2733">Clean dataset</text>
<text x="14" y="70" font-size="11" fill="#5b6775">COCO128, VisDrone subset</text>
<text x="14" y="96" font-size="12.5" font-weight="700" fill="#1d2733">Controlled errors</text>
<text x="14" y="112" font-size="11" fill="#5b6775">missing, wrong class,</text>
<text x="14" y="127" font-size="11" fill="#5b6775">shifted, spurious box</text>
</g>
<line x1="234.5" y1="179" x2="260.5" y2="179" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>
<g transform="translate(264.5,86)">
<rect width="198.5" height="186" rx="10" fill="#eef3f8" stroke="#c9d3dd"/>
<text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">2 · REFERENCE MODEL</text>
<text x="14" y="54" font-size="12.5" font-weight="700" fill="#1d2733">Cross-fitting</text>
<text x="14" y="70" font-size="11" fill="#5b6775">each half inspected by a</text>
<text x="14" y="85" font-size="11" fill="#5b6775">model trained on the other</text>
<text x="14" y="111" font-size="12.5" font-weight="700" fill="#1d2733">Out-of-sample predictions</text>
<text x="14" y="127" font-size="11" fill="#5b6775">no label leakage</text>
</g>
<line x1="467.0" y1="179" x2="493.0" y2="179" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>
<g transform="translate(497.0,86)">
<rect width="198.5" height="186" rx="10" fill="#2c5578"/>
<text x="14" y="26" font-size="11" font-weight="700" fill="#f0d79e" letter-spacing=".6">3 · DETECTION</text>
<text x="14" y="54" font-size="12.5" font-weight="700" fill="#ffffff">Label quality score</text>
<text x="14" y="70" font-size="11" fill="#d7e3ee">per image (cleanlab)</text>
<text x="14" y="96" font-size="12.5" font-weight="700" fill="#ffffff">Flagged images</text>
<text x="14" y="112" font-size="11" fill="#d7e3ee">ranked for review</text>
<text x="14" y="138" font-size="12.5" font-weight="700" fill="#ffffff">Precision / recall</text>
<text x="14" y="154" font-size="11" fill="#d7e3ee">vs injected errors</text>
</g>
<line x1="699.5" y1="179" x2="725.5" y2="179" stroke="#c8962e" stroke-width="2.2" marker-end="url(#a)"/>
<g transform="translate(729.5,86)">
<rect width="198.5" height="186" rx="10" fill="#eef3f8" stroke="#c9d3dd"/>
<text x="14" y="26" font-size="11" font-weight="700" fill="#2c5578" letter-spacing=".6">4 · IMPACT</text>
<text x="14" y="54" font-size="12.5" font-weight="700" fill="#1d2733">Retraining</text>
<text x="14" y="70" font-size="11" fill="#5b6775">clean · noisy · cleaned</text>
<text x="14" y="96" font-size="12.5" font-weight="700" fill="#1d2733">Same clean validation set</text>
<text x="14" y="112" font-size="11" fill="#5b6775">for all three</text>
<text x="14" y="138" font-size="12.5" font-weight="700" fill="#1d2733">mAP difference</text>
<text x="14" y="154" font-size="11" fill="#5b6775">cost of label noise</text>
</g>
</svg>
